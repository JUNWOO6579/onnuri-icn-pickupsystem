<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온누리 유치부 호출 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Excel 처리 라이브러리 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 폰트 및 컬러 시스템 */
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap');
        
        :root {
            /* 구분이 확실한 24가지 고대비 컬러 팔레트 */
            --p-1: #1e40af; --p-2: #be185d; --p-3: #065f46; --p-4: #9a3412; 
            --p-5: #5b21b6; --p-6: #854d0e; --p-7: #3730a3; --p-8: #155e75;
            --p-9: #991b1b; --p-10: #0f766e; --p-11: #3f6212; --p-12: #78350f;
            --p-13: #0369a1; --p-14: #6b21a8; --p-15: #86198f; --p-16: #dc2626;
            --p-17: #16a34a; --p-18: #2563eb; --p-19: #db2777; --p-20: #475569;
            --p-21: #fb923c; --p-22: #2dd4bf; --p-23: #a855f7; --p-24: #65a30d;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #f1f5f9;
            margin: 0; padding: 0;
            height: 100%; width: 100vw;
            overflow: hidden; 
            position: fixed;
        }

        .font-jua { font-family: 'Jua', sans-serif; }
        .font-gaegu { font-family: 'Gaegu', cursive; }

        #app {
            position: fixed; inset: 0; width: 100%; height: 100dvh;
            background: #fff url('final_artwork_latest_8k.jpg') no-repeat center center / cover !important;
            display: grid; grid-template-rows: 90px 1fr 85px;
            box-shadow: 0 0 60px rgba(0,0,0,0.15); margin: 0 auto; z-index: 10;
        }

        .app-header { 
            height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(255,255,255,0.05); backdrop-filter: blur(5px);
        }

        .main-scroll-view { overflow: hidden; display: flex; flex-direction: column; height: 100%; }

        .glass-stage {
            background: rgba(255, 255, 255, 0.96); border-radius: 2.5rem;
            margin: 5px 20px 15px 20px; padding: 20px 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.06);
            flex: 1; display: flex; flex-direction: column; overflow-y: auto !important; 
            overflow-x: hidden; border: 4px solid #fff; backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch; min-height: 0;
        }

        .bottom-nav {
            height: 90px; background: rgba(255, 255, 255, 0.98); border-top: 1px solid #e2e8f0;
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom); border-radius: 35px 35px 0 0; z-index: 1000;
        }

        .class-btn {
            aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-family: 'Jua', sans-serif; line-height: 1.1;
            padding: 8px; text-align: center; word-break: keep-all; border-radius: 1.8rem;
            background: white; border: 2px solid #f1f5f9; box-shadow: 0 4px 0 #e2e8f0;
            transition: all 0.1s ease; color: #334155; width: 100%; font-weight: 800;
        }
        @media (min-width: 640px) { .class-btn { font-size: 1.8rem; border-radius: 2.2rem; box-shadow: 0 6px 0 #e2e8f0; } }
        .class-btn:active { transform: scale(0.95) translateY(3px); box-shadow: none; }

        /* 컬러 클래스 (c-1 ~ c-24) */
        .c-1 { background-color: var(--p-1) !important; } .c-2 { background-color: var(--p-2) !important; }
        .c-3 { background-color: var(--p-3) !important; } .c-4 { background-color: var(--p-4) !important; }
        .c-5 { background-color: var(--p-5) !important; } .c-6 { background-color: var(--p-6) !important; }
        .c-7 { background-color: var(--p-7) !important; } .c-8 { background-color: var(--p-8) !important; }
        .c-9 { background-color: var(--p-9) !important; } .c-10 { background-color: var(--p-10) !important; }
        .c-11 { background-color: var(--p-11) !important; } .c-12 { background-color: var(--p-12) !important; }
        .c-13 { background-color: var(--p-13) !important; } .c-14 { background-color: var(--p-14) !important; }
        .c-15 { background-color: var(--p-15) !important; } .c-16 { background-color: var(--p-16) !important; }
        .c-17 { background-color: var(--p-17) !important; } .c-18 { background-color: var(--p-18) !important; }
        .c-19 { background-color: var(--p-19) !important; } .c-20 { background-color: var(--p-20) !important; }
        .c-21 { background-color: var(--p-21) !important; } .c-22 { background-color: var(--p-22) !important; }
        .c-23 { background-color: var(--p-23) !important; } .c-24 { background-color: var(--p-24) !important; }

        #view-display { 
            position: fixed; inset: 0; z-index: 9000; background: #000; 
            display: none; justify-content: center; align-items: center;
        }
        .display-container {
            width: 100%; height: 100%; max-width: 180vh; max-height: 60vw;
            background: #f0f9ff url('final_artwork_latest_8k.jpg') no-repeat center center / cover !important; 
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .display-overlay { flex: 1; background: rgba(255, 255, 255, 0.15); display: flex; flex-direction: column; padding: 3vh 4vw; overflow: hidden; }
        .display-header { height: 18vh; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .ticker-container { 
            flex: 1; margin-top: 2vh; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            gap: 2vw; 
            overflow: hidden;
        }
        
        .call-card { 
            border-radius: 2rem; border: 0.7vw solid #fff; box-shadow: 0 1.5vh 4vh rgba(0, 0, 0, 0.2); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            padding: 2vh; height: 100%; position: relative; cursor: pointer; transition: transform 0.1s active;
        }
        .call-card:active { transform: scale(0.95); opacity: 0.8; }
        
        .display-sequence {
            position: absolute; top: 1.5vh; left: 1.5vw; font-family: 'Jua', sans-serif; font-size: 3.2vh;
            color: #fff; background: rgba(0,0,0,0.45); width: 5.5vh; height: 5.5vh; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,0.4); pointer-events: none;
        }

        .display-student-name { 
            font-family: 'Jua', sans-serif; font-size: 7.5vh; white-space: nowrap; color: white; 
            text-shadow: 4px 4px 10px rgba(0,0,0,0.6); letter-spacing: -0.02em; pointer-events: none;
        }

        .display-class-label { 
            font-family: 'Gaegu', cursive; font-size: 3.2vh; font-weight: 800; background: rgba(255,255,255,0.95); 
            padding: 0.2vh 2vw; border-radius: 99px; color: #000; margin-bottom: 1vh; pointer-events: none;
        }

        #loading-overlay {
            position: fixed; inset: 0; background: white; display: flex; justify-content: center; align-items: center;
            z-index: 1000000; transition: opacity 0.5s ease;
        }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center;
            z-index: 999999; backdrop-filter: blur(15px); padding: 20px;
        }
        
        .notice-modal-content {
            background: white; border-radius: 4rem; width: 95%; max-width: 580px;
            padding: 40px 30px; text-align: center; position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3); border: 8px solid #f0f9ff;
        }
        .close-x-btn {
            position: absolute; top: 25px; right: 30px; width: 50px; height: 50px;
            background: #f1f5f9; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #64748b; font-size: 30px; cursor: pointer; z-index: 10;
        }

        /* 단계 전환 애니메이션 제거를 위한 스타일 */
        .step-container { overflow: hidden; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mb-6"></div>
            <p class="font-jua text-3xl text-slate-400">시스템 로딩 중...</p>
        </div>
    </div>

    <!-- 앱 전체 -->
    <div id="app" style="display: none; opacity: 0;">
        <header class="app-header">
            <h1 class="font-gaegu text-4xl sm:text-5xl text-blue-600 font-bold">유치부 아이들 대기 waiting</h1>
            <p class="text-[11px] font-bold text-slate-400 tracking-[0.4em] uppercase">Onnuri ICN Youth</p>
        </header>

        <div class="main-scroll-view">
            <div class="glass-stage" id="main-glass-stage">
                <div id="container-parent">
                    <div class="step-container" id="section-worship">
                        <h2 class="font-jua text-xl text-slate-700 mb-2 font-bold"><i class="fa-solid fa-heart text-pink-400"></i> 1. 예배 선택</h2>
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <button id="btn-p1" class="py-5 border-2 border-blue-50 text-blue-600 font-jua text-3xl rounded-[2.5rem] bg-blue-50/20 active:bg-blue-100">유치1부</button>
                            <button id="btn-p2" class="py-5 border-2 border-orange-50 text-orange-600 font-jua text-3xl rounded-[2.5rem] bg-orange-50/30 active:bg-orange-100">유치2부</button>
                        </div>
                    </div>

                    <div id="section-class" class="step-container hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-jua text-xl text-slate-700 font-bold"><i class="fa-solid fa-school text-orange-400"></i> 2. 우리 반 선택</h2>
                            <button id="btn-reset" class="text-sm text-slate-400 underline font-bold px-4">다시 선택</button>
                        </div>
                        <div id="grid-classes" class="grid grid-cols-3 sm:grid-cols-4 gap-4 mb-8"></div>
                    </div>

                    <div id="section-name" class="step-container hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-jua text-xl text-slate-700 font-bold"><i class="fa-solid fa-child-reaching text-green-400"></i> 3. 아이 이름 클릭</h2>
                            <button id="btn-back" class="text-sm text-slate-400 underline font-bold px-4">반 다시 선택</button>
                        </div>
                        <div id="grid-names" class="grid grid-cols-2 sm:grid-cols-3 gap-5 mb-8"></div>
                    </div>

                    <div id="section-manual" class="pt-6 border-t border-slate-100 mt-6 mb-2">
                        <h2 class="font-gaegu text-2xl text-pink-500 mb-4 font-bold">방문/새친구 이름</h2>
                        <div class="grid grid-cols-[1fr_auto] gap-3">
                            <input type="text" id="manual-input" class="p-5 bg-slate-50 rounded-[2rem] border-none font-bold text-xl shadow-inner" placeholder="이름 입력">
                            <button id="btn-manual" class="shrink-0 bg-pink-500 text-white font-jua px-10 rounded-[2rem] shadow-xl text-xl active:scale-95">호출</button>
                        </div>
                    </div>
                </div>

                <div id="container-settings" class="hidden py-4">
                    <h2 class="font-jua text-3xl text-slate-800 mb-8 font-bold text-center">시스템 관리</h2>
                    <div class="max-w-2xl mx-auto space-y-12">
                        <div class="bg-indigo-50/50 p-8 rounded-[2.5rem] border border-indigo-100">
                            <h3 class="font-bold text-slate-800 text-xl mb-4"><i class="fa-solid fa-file-excel text-emerald-600"></i> 명단 업데이트</h3>
                            <input type="file" id="excelInput" accept=".xlsx, .xls" class="block w-full text-base file:mr-6 file:py-3 file:px-8 file:rounded-full file:border-0 file:font-bold file:bg-white file:text-indigo-700 cursor-pointer"/>
                            <button id="importBtn" class="w-full py-6 bg-indigo-600 text-white rounded-[2rem] font-jua text-2xl shadow-xl mt-8">엑셀 파일 업데이트</button>
                        </div>
                        <div class="bg-red-50/50 p-8 rounded-[2.5rem] border border-red-100 text-center">
                            <h3 class="font-bold text-red-600 text-xl mb-4">기록 초기화</h3>
                            <button id="btn-clear" class="w-full py-6 bg-red-500 text-white rounded-[2rem] font-jua text-2xl shadow-xl">스크린 명단 비우기</button>
                        </div>
                        <div class="text-center"><button id="btn-logout" class="text-sm text-slate-400 underline">로그아웃</button></div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button id="nav-parent" class="flex flex-col items-center gap-2 text-blue-600"><i class="fa-solid fa-tablet-screen-button text-3xl"></i><span class="text-xs font-bold uppercase">호출기</span></button>
            <button id="nav-display" class="flex flex-col items-center gap-2 text-slate-400"><i class="fa-solid fa-desktop text-3xl"></i><span class="text-xs font-bold uppercase">전광판</span></button>
            <button id="nav-settings" class="flex flex-col items-center gap-2 text-slate-400"><i class="fa-solid fa-user-lock text-3xl"></i><span class="text-xs font-bold uppercase">설정</span></button>
        </nav>
    </div>

    <!-- 전광판 레이어 -->
    <div id="view-display">
        <div class="display-container">
            <div class="display-overlay">
                <header class="display-header">
                    <div class="text-left text-blue-900">
                        <h1 class="font-gaegu text-[8vh] leading-tight font-bold">친구들! 다음주에 만나요</h1>
                        <p class="opacity-50 font-jua text-[3vh] uppercase tracking-[0.5em] ml-2 font-black">Happy Pickup Board</p>
                    </div>
                    <div class="bg-white/90 backdrop-blur px-[3vw] py-[2vh] rounded-[2rem] shadow-xl border-4 border-white text-center">
                        <span id="display-clock" class="font-jua text-[8vh] text-blue-500 tracking-tighter">00:00</span>
                    </div>
                </header>
                <div id="display-grid" class="ticker-container">
                    <!-- JS에서 최대 10명만 고정 렌더링 -->
                </div>
                <button id="btn-disp-home" class="absolute bottom-[4vh] right-[4vw] w-[9vh] h-[9vh] bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-slate-600 shadow-2xl border-2 border-white"><i class="fa-solid fa-house-chimney text-[4.5vh]"></i></button>
            </div>
        </div>
    </div>

    <div id="notice-modal" class="modal-overlay">
        <div class="notice-modal-content">
            <div class="close-x-btn" id="btn-close-notice-x"><i class="fa-solid fa-xmark"></i></div>
            <div class="w-28 h-28 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-8"><i class="fa-solid fa-bell-concierge text-7xl"></i></div>
            <h3 class="font-jua text-4xl sm:text-5xl text-slate-800 mb-6 font-bold text-center">호출 완료!</h3>
            <p class="font-gaegu text-2xl sm:text-3xl text-slate-600 leading-relaxed font-bold break-keep text-center">샬롬! 부모님들께서는 오신 순서대로,<br>한줄로 서서 기다려주시면, 차례대로<br>아이들이 나올 수 있게 도와드리겠습니다.<br>감사합니다!</p>
            <button id="btn-close-notice" class="w-full mt-10 py-8 bg-blue-600 text-white rounded-[3rem] font-jua text-3xl sm:text-4xl shadow-xl active:scale-95 transition-transform">확인</button>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <div class="bg-white rounded-[5rem] w-full max-w-[500px] p-16 shadow-2xl text-center space-y-10">
            <h3 class="font-jua text-4xl text-slate-800 font-bold">관리자 인증</h3>
            <input type="password" id="authPwInput" class="w-full p-8 bg-slate-100 rounded-[3rem] text-center font-bold text-6xl border-none focus:ring-4 focus:ring-blue-200" placeholder="****">
            <div class="flex gap-4">
                <button id="btn-close-auth" class="flex-1 py-8 bg-slate-100 text-slate-500 rounded-[3rem] font-bold text-xl">취소</button>
                <button id="btn-confirm-auth" class="flex-1 py-8 bg-blue-600 text-white rounded-[3rem] font-bold shadow-lg text-xl">확인</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-32 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-10 py-5 rounded-full font-jua text-2xl opacity-0 transition-all z-[999999] pointer-events-none">메시지</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, addDoc, serverTimestamp, getDoc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0a28S4lqXIrEc8l0-ik6Z5FUX53kNbC4",
            authDomain: "onnuri-icn-pickup.firebaseapp.com",
            projectId: "onnuri-icn-pickup",
            storageBucket: "onnuri-icn-pickup.firebasestorage.app",
            messagingSenderId: "227891248834",
            appId: "1:227891248834:web:e593f212fe7d049e39455b",
            measurementId: "G-0P55H09XZY"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appIdStr = 'onnuri-pickup-final-v66';

        const nodes = {
            app: document.getElementById('app'),
            loading: document.getElementById('loading-overlay'),
            tickerGrid: document.getElementById('display-grid'),
            scrollArea: document.getElementById('main-glass-stage')
        };

        let classStructure = {};
        let isAdminAuthorized = false;
        let allPickupCalls = [];
        let deleteConfirmActive = false;

        window.showToast = (m) => {
            const t = document.getElementById('toast');
            if (t) { t.innerText = m; t.classList.add('opacity-100'); setTimeout(() => t.classList.remove('opacity-100'), 2000); }
        };

        async function init() {
            try { await signInAnonymously(auth); onAuthStateChanged(auth, (user) => { if (user) fetchData(); }); } catch (e) { console.error(e); }
        }

        async function fetchData() {
            try {
                const snap = await getDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'config', 'structure'));
                classStructure = snap.exists() ? snap.data().map : { "유치1부": {}, "유치2부": {} };
                startClock(); subscribeCalls(); hideLoading();
            } catch (e) { console.error(e); }
        }

        function hideLoading() {
            nodes.loading.style.opacity = '0';
            setTimeout(() => {
                nodes.loading.style.display = 'none'; nodes.app.style.display = 'grid';
                setTimeout(() => { nodes.app.style.opacity = '1'; window.switchMode('parent'); }, 30);
            }, 400);
        }

        window.switchMode = (mode) => {
            if (mode === 'settings' && !isAdminAuthorized) return;
            if (mode === 'display') { nodes.app.style.display = 'none'; document.getElementById('view-display').style.display = 'flex'; renderTicker(); return; }
            nodes.app.style.display = 'grid'; document.getElementById('view-display').style.display = 'none';
            document.getElementById('container-parent').style.display = (mode === 'parent') ? 'block' : 'none';
            document.getElementById('container-settings').style.display = (mode === 'settings') ? 'block' : 'none';
            ['nav-parent', 'nav-display', 'nav-settings'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.replace('text-blue-600', 'text-slate-400');
            });
            const activeNav = document.getElementById(`nav-${mode}`);
            if(activeNav) activeNav.classList.replace('text-slate-400', 'text-blue-600');
        };

        window.requestAdminAccess = () => { if (isAdminAuthorized) window.switchMode('settings'); else document.getElementById('auth-modal').style.display = 'flex'; };
        window.confirmAdminAuth = () => { if (document.getElementById('authPwInput').value === '1234') { isAdminAuthorized = true; document.getElementById('auth-modal').style.display = 'none'; window.switchMode('settings'); } else { window.showToast("오류"); } };

        /* [수정] 호출기 단계 전환 즉시 처리 (애니메이션 제거) */
        window.selectPartAndRollUp = (part) => {
            document.getElementById('section-worship').classList.add('hidden'); // hidden 사용으로 즉시 숨김
            document.getElementById('section-class').classList.remove('hidden');
            document.getElementById('section-name').classList.add('hidden');
            
            const grid = document.getElementById('grid-classes'); grid.innerHTML = '';
            const data = classStructure[part] || {};
            Object.keys(data).forEach(age => {
                data[age].forEach(cls => {
                    if (!cls.name || cls.name.trim() === "") return;
                    const btn = document.createElement('button'); btn.className = "class-btn shadow-sm"; btn.innerText = cls.name; btn.onclick = () => renderStudentList(cls); grid.appendChild(btn);
                });
            });
            nodes.scrollArea.scrollTo(0, 0);
        };

        function renderStudentList(cls) {
            document.getElementById('section-class').classList.add('hidden'); // hidden 사용으로 즉시 숨김
            document.getElementById('section-name').classList.remove('hidden');
            
            const grid = document.getElementById('grid-names'); grid.innerHTML = '';
            if (cls.students) {
                cls.students.forEach(name => {
                    const btn = document.createElement('button'); 
                    btn.className = "py-8 bg-green-500 text-white font-jua rounded-[2.2rem] shadow-md active:translate-y-1 text-center text-4xl font-extrabold"; 
                    btn.innerText = name; btn.onclick = () => sendCallToFirebase(cls.name, name); grid.appendChild(btn);
                });
            }
            nodes.scrollArea.scrollTo(0, 0);
        }

        async function sendCallToFirebase(cName, sName) { 
            try { 
                const counterRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'config', 'counter');
                const counterSnap = await getDoc(counterRef);
                let nextNum = 1;
                if(counterSnap.exists()) nextNum = (counterSnap.data().count || 0) + 1;
                
                await updateDoc(counterRef, { count: nextNum }).catch(async () => {
                    await setDoc(counterRef, { count: nextNum });
                });

                await addDoc(collection(db, 'artifacts', appIdStr, 'public', 'data', 'pickup_calls'), { 
                    className: cName, 
                    studentName: sName, 
                    timestamp: serverTimestamp(),
                    waitingNum: nextNum 
                });
                document.getElementById('notice-modal').style.display = 'flex'; 
            } catch (e) { window.showToast("연결 오류"); } 
        }

        window.sendManualCall = async () => { const name = document.getElementById('manual-input').value.trim(); if (!name) return; await sendCallToFirebase("방문/새친구", name); document.getElementById('manual-input').value = ''; };

        function subscribeCalls() {
            onSnapshot(collection(db, 'artifacts', appIdStr, 'public', 'data', 'pickup_calls'), (snap) => {
                const raw = []; snap.forEach(d => raw.push({ id: d.id, ...d.data() }));
                const unique = new Map(); 
                raw.forEach(call => { 
                    const key = `${call.className}-${call.studentName}`; 
                    if (!unique.has(key)) unique.set(key, call); 
                });
                allPickupCalls = Array.from(unique.values()).sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
                renderTicker();
            });
        }

        window.removeSingleCall = async (callId) => { if (!callId) return; try { await deleteDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'pickup_calls', callId)); } catch (err) { console.error(err); } };

        const getColorByClassName = (className) => {
            if (!className) return 'c-20';
            const cn = className.replace(/반|부/g, "").trim();
            if (cn === "방문/새친구") return 'c-16'; 
            
            const fixedMap = {
                "기드온": "c-1", "바나바": "c-2", "베드로": "c-3", "보아스": "c-4",
                "사무엘": "c-5", "안드레": "c-6", "야고보": "c-7", "에스더": "c-8",
                "노아": "c-10", "다윗": "c-11", "디도": "c-12", "바울": "c-13",
                "빌립": "c-14", "야곱": "c-15", "에녹": "c-17", "요나": "c-18",
                "요한": "c-19", "한나": "c-20", "요나단": "c-21", "기쁨": "c-22",
                "사랑": "c-23", "소망": "c-24", "믿음": "c-9"
            };
            
            if (fixedMap[cn]) return fixedMap[cn];
            let h = 0; for (let i = 0; i < cn.length; i++) h = (h * 31) ^ cn.charCodeAt(i);
            return `c-${Math.abs(h % 24) + 1}`;
        };

        function renderTicker() {
            const grid = nodes.tickerGrid; if (!grid) return; 
            grid.innerHTML = '';

            if (allPickupCalls.length === 0) return;
            
            const listToShow = allPickupCalls.slice(0, 10);
            const fragment = document.createDocumentFragment();
            
            listToShow.forEach((call) => {
                const card = document.createElement('div'); 
                const assignedColor = getColorByClassName(call.className);
                card.className = `call-card ${assignedColor}`;
                card.onclick = () => window.removeSingleCall(call.id);
                
                card.innerHTML = `
                    <div class="display-sequence">${call.waitingNum || '?'}</div>
                    <p class="display-class-label">${call.className}</p>
                    <p class="display-student-name">${call.studentName}</p>
                `; 
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        }

        document.getElementById('btn-clear').onclick = async () => {
            const btn = document.getElementById('btn-clear');
            if (!deleteConfirmActive) {
                deleteConfirmActive = true; btn.innerText = "진짜 삭제할까요? (한번 더 클릭)"; btn.classList.replace('bg-red-500', 'bg-red-700');
                setTimeout(() => { deleteConfirmActive = false; btn.innerText = "스크린 명단 비우기"; btn.classList.replace('bg-red-700', 'bg-red-500'); }, 4000);
                return;
            }
            const snap = await getDocs(collection(db, 'artifacts', appIdStr, 'public', 'data', 'pickup_calls'));
            await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
            await setDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'config', 'counter'), { count: 0 });
            window.showToast("초기화 완료");
        };

        document.getElementById('importBtn').onclick = async () => {
            const file = document.getElementById('excelInput').files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                const tempMap = { "유치1부": {}, "유치2부": {} };
                let curP = "유치1부", hIdx = rows.findIndex(r => r && r.some(c => String(c).includes('이름')));
                const hs = rows[hIdx], aI = hs.findIndex(h => h && (String(h).includes('나이')||String(h).includes('연령'))), cI = hs.findIndex(h => h && String(h).includes('반')), nI = hs.findIndex(h => h && (String(h).includes('이름')||String(h).includes('학생명')));
                rows.forEach((row, i) => {
                    if (!row || i <= hIdx) return;
                    if (row.join('|').includes('2부')) curP = "유치2부";
                    const n = row[nI] ? String(row[nI]).trim() : "";
                    let cRaw = row[cI] ? String(row[cI]).trim() : "", aRaw = row[aI] ? String(row[aI]).trim() : "";
                    if (!n || !cRaw || cRaw === "반") return;
                    let ak = aRaw ? aRaw.replace(/[^0-9]/g, "") + "세" : "공통", targetC = cRaw.split('(')[0].trim();
                    if (!tempMap[curP][targetC]) tempMap[curP][targetC] = { age: ak, students: [] };
                    if (!tempMap[curP][targetC].students.includes(n)) tempMap[curP][targetC].students.push(n);
                });
                const finalMap = { "유치1부": {}, "유치2부": {} };
                ['유치1부', '유치2부'].forEach(p => { Object.keys(tempMap[p]).forEach(cn => { const it = tempMap[p][cn]; if (!finalMap[p][it.age]) finalMap[p][it.age] = []; finalMap[p][it.age].push({ name: cn, students: it.students }); }); });
                await setDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'config', 'structure'), { map: finalMap });
                classStructure = finalMap; window.showToast("성공!"); window.switchMode('parent');
            }; reader.readAsArrayBuffer(file);
        };

        document.getElementById('btn-p1').onclick = () => window.selectPartAndRollUp('유치1부');
        document.getElementById('btn-p2').onclick = () => window.selectPartAndRollUp('유치2부');
        document.getElementById('btn-reset').onclick = () => { 
            document.getElementById('section-worship').classList.remove('hidden'); 
            document.getElementById('section-class').classList.add('hidden'); 
        };
        document.getElementById('btn-back').onclick = () => { 
            document.getElementById('section-class').classList.remove('hidden'); 
            document.getElementById('section-name').classList.add('hidden'); 
        };
        document.getElementById('btn-manual').onclick = () => window.sendManualCall();
        document.getElementById('nav-parent').onclick = () => window.switchMode('parent');
        document.getElementById('nav-display').onclick = () => window.switchMode('display');
        document.getElementById('nav-settings').onclick = () => window.requestAdminAccess();
        document.getElementById('btn-disp-home').onclick = () => window.switchMode('parent');
        document.getElementById('btn-close-notice').onclick = () => { document.getElementById('notice-modal').style.display = 'none'; };
        document.getElementById('btn-close-notice-x').onclick = () => { document.getElementById('notice-modal').style.display = 'none'; };
        document.getElementById('btn-confirm-auth').onclick = () => window.confirmAdminAuth();
        document.getElementById('btn-close-auth').onclick = () => { document.getElementById('auth-modal').style.display = 'none'; };

        function startClock() { setInterval(() => { const clock = document.getElementById('display-clock'); if (clock) { const now = new Date(); clock.innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0'); } }, 1000); }
        init();
    </script>
</body>
</html>
